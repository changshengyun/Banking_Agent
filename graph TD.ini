graph TD
    subgraph Client_Side [手机银行客户端 Flutter]
        UI1[正常交易流程]
        UI2[风险节点流可视化弹窗]
        Edge[交易边缘特征]
    end

    subgraph Perception_Layer [感知层 - MCP 总线]
        MCP_In[内部资源服务器: 语义压缩脉冲]
        MCP_Ext[外部工具服务器: Neo4j/AML 情报]
    end

    subgraph Governance_Control [治理控制层 - 控制平面]
        Privacy[隐私网关: 去标识化]
        Engine[策略引擎: 审计与编排]
    end

    subgraph Cognitive_Layer [认知决策层 - 多智能体集群]
        A1[犯罪检测: 报警解释]
        A2[对抗质询: 意图识别 G分]
        A3[细化分类: 动态权重 α 计算]
        A4[柜员决策: F分融合判定]
        A5[叙述智能体: 证据链报告]
    end

    %% 数据流转
    Edge --> MCP_In
    MCP_In & MCP_Ext --> Privacy
    Privacy -- 匿名化特征包 --> Cognitive_Layer
    A1 --> A2 --> A3 --> A4
    A4 -- 建议指令 --> Engine
    Engine -- 审计后决策 --> UI2
    UI2 -- 人工介入触发 --> A5
    A5 -- 完整证据链报告 --> Auditor[人工风控专家]

    %% 状态定义
    style UI2 fill:#f1f,stroke:#333,stroke-width:2px
    style Engine fill:#f96,stroke:#333,stroke-width:2px
